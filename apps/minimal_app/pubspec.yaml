name: minimal_app
description: Minimal reference application for the admitted V2 foundation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.1 <3.13.0"
  flutter: ">=3.44.1 <3.45.0"

resolution: workspace

dependencies:
  auth_core: ^0.1.0
  auth_ui: ^0.1.0
  flutter:
    sdk: flutter
  design_system: ^0.1.0
  networking: ^0.1.0
  platform_foundation: ^0.1.0
  storage: ^0.1.0
  go_router: ^18.1.0
  flutter_bloc: ^9.1.1

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: ^4.5.0

flutter:
  uses-material-design: true
