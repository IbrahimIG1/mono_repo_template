include: package:lints/recommended.yaml

analyzer:
  exclude:
    - "**/build/**"
    - "apps/admin_app/**"
    - "apps/user_app/**"
    - "core/**"
    - "shared/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - directives_ordering
    - discarded_futures
    - unawaited_futures
    - use_super_parameters
