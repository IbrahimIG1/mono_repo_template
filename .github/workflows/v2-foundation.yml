name: V2 Platform

on:
  push:
    branches: [main, "v2/**", "goal-*"]
  pull_request:

concurrency:
  group: v2-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run tool/workspace.dart verify
      - run: dart analyze --fatal-warnings --fatal-infos
      - run: dart test tool/test
      - run: dart run tool/check_architecture.dart
      - run: dart run tool/verify_temporary_consumer.dart
      - run: dart run tool/verify_optional_capabilities.dart --android

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --no-pub
        working-directory: apps/minimal_app
