name: V2 Goal 2 spike

on:
  workflow_dispatch:
  push:
    branches:
      - v2/goal-2-spike

concurrency:
  group: v2-goal2-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  quality:
    name: Workspace, tests, and routes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify pinned toolchain
        run: |
          flutter --version
          flutter --version --machine | grep -q '"frameworkVersion": "3.44.1"'
          dart --version
      - name: Resolve the root lockfile
        run: flutter pub get --enforce-lockfile
      - name: Verify workspace members
        run: dart pub workspace list
      - name: Run workspace gates
        run: dart run tool/workspace.dart verify
      - name: Verify generated and formatted sources are current
        run: git diff --exit-code

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            runner: ubuntu-latest
            command: flutter build apk --debug --no-pub
          - platform: iOS
            runner: macos-latest
            command: flutter build ios --release --no-codesign --no-pub
          - platform: Web
            runner: ubuntu-latest
            command: flutter build web --release --no-pub
          - platform: Windows
            runner: windows-latest
            command: flutter build windows --release --no-pub
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the root lockfile
        run: flutter pub get --enforce-lockfile
      - name: Build scratch app
        working-directory: spikes/goal2/scratch_app
        run: ${{ matrix.command }}

  windows-runtime:
    name: Windows secure-storage runtime
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Run the Windows plugin round trip
        working-directory: spikes/goal2/scratch_app
        run: >-
          flutter test integration_test/platform_probes_test.dart
          -d windows --no-pub

  web-runtime:
    name: Web storage and WebSocket runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Run browser probes
        working-directory: spikes/goal2/scratch_app
        shell: bash
        run: |
          set -euo pipefail
          command -v chromedriver || {
            echo '::error title=ChromeDriver unavailable::chromedriver is not on PATH'
            exit 1
          }
          chromedriver --version
          google-chrome --version || true
          chromedriver --port=4444 --allowed-ips=127.0.0.1 \
            > "$RUNNER_TEMP/chromedriver.log" 2>&1 &
          driver_pid=$!
          dart ../websocket_probe_server.dart 9234 \
            > "$RUNNER_TEMP/websocket-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$driver_pid" "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..100}; do
            if curl -fsS http://127.0.0.1:4444/status | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'; then
              break
            fi
            sleep 0.1
          done
          for attempt in {1..100}; do
            if grep -q '^READY ' "$RUNNER_TEMP/websocket-server.log"; then
              break
            fi
            sleep 0.1
          done

          if ! curl -fsS http://127.0.0.1:4444/status | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'; then
            driver_tail=$(tail -n 20 "$RUNNER_TEMP/chromedriver.log" | tr '\n' ' ')
            echo "::error title=ChromeDriver readiness failed::$driver_tail"
            exit 1
          fi
          if ! grep -q '^READY ' "$RUNNER_TEMP/websocket-server.log"; then
            server_tail=$(tail -n 20 "$RUNNER_TEMP/websocket-server.log" | tr '\n' ' ')
            echo "::error title=WebSocket server readiness failed::$server_tail"
            exit 1
          fi
          set +e
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/platform_probes_test.dart \
            -d chrome \
            --no-pub \
            --web-browser-flag=--headless=new \
            --dart-define=SPIKE_WEBSOCKET_URL=ws://127.0.0.1:9234/socket \
            2>&1 | tee "$RUNNER_TEMP/flutter-drive.log"
          drive_status=${PIPESTATUS[0]}
          set -e
          if [[ $drive_status -ne 0 ]]; then
            drive_tail=$(tail -n 30 "$RUNNER_TEMP/flutter-drive.log" | tr '\n' ' ')
            echo "::error title=Flutter drive failed::$drive_tail"
            exit "$drive_status"
          fi
          cat "$RUNNER_TEMP/websocket-server.log"
          if ! grep -q '^ACCEPT origin=' "$RUNNER_TEMP/websocket-server.log"; then
            server_tail=$(tail -n 20 "$RUNNER_TEMP/websocket-server.log" | tr '\n' ' ')
            echo "::error title=WebSocket ticket was not accepted::$server_tail"
            exit 1
          fi
